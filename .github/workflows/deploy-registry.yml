name: Deploy registry Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test Worker registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused Worker tests
        run: |
          set -eu
          npm run test:worker
  deploy:
    name: Deploy Durable Object registry
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      JANUS_BOOTSTRAP_SECRET: ${{ secrets.JANUS_BOOTSTRAP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --config worker/wrangler.jsonc
      - name: Set bootstrap secret
        run: |
          test -n "$JANUS_BOOTSTRAP_SECRET"
          printf '%s' "$JANUS_BOOTSTRAP_SECRET" | npx --yes wrangler@latest secret put JANUS_BOOTSTRAP_SECRET --config worker/wrangler.jsonc
